<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C — Ріка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═════════════════════════════════════════════════════════════════════════
   C — РІКА
   Ані сітка, ані таймлайн подій. Тут час — це ТЕЧІЯ, а проєкти — рукави,
   що набухають і всихають. Товщина стрічки = скільки вашого часу проєкт
   забрав того тижня. Видно, як щось починається тонкою ниткою, розливається
   на пів осені й пересихає.

   Палітра холодне чорнило + захід сонця: глибока синь під сподом, теплі
   стрічки згори. Ніякого неону.

   Провалювання в проєкт: ріка ЗСІДАЄ у вузьку стрічку зверху, обраний рукав
   лишається кольоровим, решта стає попелом — і знизу піднімається досьє.
   ═════════════════════════════════════════════════════════════════════════ */
:root{
  --deep:oklch(15% 0.035 250);
  --deep2:oklch(19% 0.04 248);
  --slab:oklch(22% 0.032 250);
  --edge:oklch(31% 0.03 250);
  --text:oklch(96% 0.01 250);
  --soft:oklch(78% 0.018 250);
  --faint:oklch(58% 0.022 250);
  --c1:oklch(76% 0.155 42);    /* персик */
  --c2:oklch(66% 0.19 12);     /* корал */
  --c3:oklch(83% 0.14 82);     /* мед */
  --c4:oklch(70% 0.13 340);    /* троянда */
  --c0:oklch(48% 0.05 235);    /* глибина, поза проєктами */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% -20%, oklch(24% 0.07 245) 0%, transparent 60%),
    linear-gradient(180deg, var(--deep) 0%, oklch(12% 0.03 252) 100%);
  min-height:100vh;color:var(--text);
  font-family:Rubik,system-ui,sans-serif;font-size:13px;
  -webkit-font-smoothing:antialiased;padding:24px 30px 60px;
}

/* ── шапка ─────────────────────────────────────────────────────────── */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:14px}
h1{font-family:'Fira Sans',sans-serif;font-weight:300;font-size:30px;letter-spacing:-.02em;line-height:1}
h1 b{font-weight:700}
.sub{color:var(--faint);font-size:12px;margin-top:6px}
.ctl{display:flex;gap:8px;align-items:center}
.pills{display:flex;gap:4px}
.pills button{
  border:1px solid var(--edge);background:none;color:var(--faint);cursor:pointer;
  padding:6px 13px;border-radius:20px;font-family:Rubik,sans-serif;font-size:11.5px;
  transition:.18s;
}
.pills button:hover{color:var(--soft);border-color:var(--faint)}
.pills button.on{background:var(--text);color:var(--deep);border-color:var(--text);font-weight:500}
.ico{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--edge);background:none;
  color:var(--faint);cursor:pointer;display:grid;place-items:center;transition:.18s;
}
.ico:hover{color:var(--text);border-color:var(--faint)}

/* ── РІКА ──────────────────────────────────────────────────────────── */
.river{
  position:relative;border-radius:18px;overflow:hidden;margin-bottom:8px;
  background:linear-gradient(180deg, oklch(18% 0.04 250), oklch(14% 0.032 252));
  box-shadow:inset 0 1px 0 oklch(34% 0.04 250), 0 34px 80px -46px oklch(4% 0.03 250);
  height:300px;transition:height .55s cubic-bezier(.16,1,.3,1);
}
.river.low{height:96px}
.river svg{display:block;width:100%;height:100%}
.river path{transition:opacity .4s, filter .4s;cursor:pointer}
.river path.mute{opacity:.13;filter:saturate(.25)}
.marks{
  position:absolute;left:0;right:0;bottom:6px;display:flex;pointer-events:none;
  padding:0 4px;
}
.marks span{flex:1;font-size:9.5px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.scrub{
  position:absolute;top:0;bottom:0;width:1px;background:oklch(96% 0.01 250 / .45);
  pointer-events:none;opacity:0;transition:opacity .15s;
}
.scrub.on{opacity:1}
.tip{
  position:absolute;pointer-events:none;background:oklch(24% 0.04 250 / .95);
  backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:12px;
  padding:10px 13px;min-width:190px;opacity:0;transition:opacity .14s;z-index:8;
  box-shadow:0 22px 50px -22px oklch(4% 0.03 250);
}
.tip.on{opacity:1}
.tip .w{font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.tip .r{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:3px}
.tip .r i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .r b{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums}

/* ── рукави ────────────────────────────────────────────────────────── */
.arms{display:flex;gap:0;margin:14px 0 24px;border-radius:14px;overflow:hidden}
.arm{
  flex:1;position:relative;cursor:pointer;padding:14px 16px;
  background:var(--slab);transition:.22s;border-right:1px solid oklch(15% 0.03 250);
}
.arm:last-child{border-right:0}
.arm:hover{background:oklch(25% 0.035 250)}
.arm:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:currentColor}
.arm.on{background:oklch(27% 0.045 250)}
.arm.on:after{content:'';position:absolute;inset:0;background:currentColor;opacity:.09}
.arm .nm{font-size:13.5px;font-weight:500;position:relative}
.arm .fig{
  font-family:'Fira Sans',sans-serif;font-weight:300;font-size:25px;line-height:1.1;
  margin-top:4px;position:relative;color:currentColor;
}
.arm .fig em{font-style:normal;font-size:11px;color:var(--faint);margin-left:4px}
.arm .tr{position:relative;display:flex;gap:1.5px;align-items:flex-end;height:16px;margin-top:8px}
.arm .tr i{flex:1;background:currentColor;border-radius:1px;opacity:.5;min-height:1px}

/* ── ДОСЬЄ ─────────────────────────────────────────────────────────── */
.file{display:none}
.file.on{display:block;animation:up .5s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.title{display:flex;align-items:flex-start;gap:20px;margin-bottom:22px}
.title .mark{
  width:6px;align-self:stretch;border-radius:4px;background:currentColor;flex:none;
  box-shadow:0 0 26px currentColor;
}
.title input{
  font-family:'Fira Sans',sans-serif;font-weight:700;font-size:33px;letter-spacing:-.025em;
  background:none;border:0;color:var(--text);outline:0;width:100%;
  padding:2px 7px;margin-left:-7px;border-radius:9px;
}
.title input:hover{background:oklch(21% 0.03 250)}
.title input:focus{background:var(--slab)}
.strip{display:flex;gap:26px;margin-top:8px;flex-wrap:wrap}
.strip div{line-height:1.15}
.strip .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.strip .v{font-family:'Fira Sans',sans-serif;font-weight:400;font-size:19px;margin-top:3px}

.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
.slab{background:var(--slab);border-radius:16px;padding:18px 20px}
.slab h4{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin-bottom:12px;display:flex;align-items:center;gap:9px;
}
.slab h4 .llm{
  border:1px solid var(--edge);border-radius:20px;padding:2px 8px;font-size:9px;
  letter-spacing:.05em;text-transform:none;color:var(--faint);
}
.said{font-size:15.5px;line-height:1.68;color:var(--soft)}
.said b{color:var(--text);font-weight:500}

.rows{display:flex;flex-direction:column;gap:2px}
.r{
  display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;
  padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .14s;
}
.r:hover{background:oklch(26% 0.035 250)}
.r .x{font-size:13.5px;line-height:1.42}
.r .m{font-size:10.5px;color:var(--faint);white-space:nowrap}
.r .m.hot{color:var(--c2)}
.r.off .x{color:var(--faint);text-decoration:line-through;text-decoration-thickness:1px}

/* люди — стовпчики, а не список */
.crowd{display:flex;gap:9px;align-items:flex-end;height:104px;margin-bottom:12px}
.head-p{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.head-p .col{
  width:100%;border-radius:6px 6px 3px 3px;background:currentColor;
  transition:filter .16s;position:relative;
}
.head-p:hover .col{filter:brightness(1.3)}
.head-p .nm{font-size:10.5px;color:var(--soft);text-align:center;line-height:1.2}
.head-p .hh{font-size:9.5px;color:var(--faint)}
.head-p.gone{opacity:.42}

.set{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px}
.opt .l{font-size:12.5px}
.opt .h{font-size:10.5px;color:var(--faint);margin-top:2px;line-height:1.4;max-width:32ch}
.sw{width:36px;height:20px;border-radius:20px;background:var(--edge);position:relative;cursor:pointer;flex:none;transition:.2s}
.sw.on{background:currentColor}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--text);transition:transform .22s cubic-bezier(.16,1,.3,1)}
.sw.on:after{transform:translateX(16px);background:var(--deep)}
.dots{display:flex;gap:7px}
.dots i{width:20px;height:20px;border-radius:50%;cursor:pointer;display:block;transition:transform .15s}
.dots i:hover{transform:scale(1.2)}
.dots i.on{box-shadow:0 0 0 2px var(--slab),0 0 0 3.5px var(--text)}
.kill{border:0;background:none;color:var(--c2);cursor:pointer;font-family:Rubik,sans-serif;
  font-size:11.5px;font-weight:500;text-align:left;padding:4px 0}

.mt{display:flex;flex-direction:column}
.mt .row{
  display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:center;
  padding:10px 11px;border-radius:10px;cursor:pointer;transition:background .14s;
}
.mt .row:hover{background:var(--slab)}
.mt .d{font-size:11px;color:var(--faint)}
.mt .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt .e{display:flex;gap:11px;font-size:10.5px;color:var(--faint);align-items:center}
.bad{border-radius:20px;padding:2px 9px;font-size:10px;font-weight:500;color:var(--deep)}
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>Ріка <b id="where">часу</b></h1>
    <div class="sub">Товщина рукава — скільки вашого часу проєкт забрав того тижня</div>
  </div>
  <div class="ctl">
    <button class="ico" title="Знайти">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <div class="pills" id="pills">
      <button data-w="8">2 місяці</button>
      <button data-w="17">квартал</button>
      <button data-w="26" class="on">пів року</button>
      <button data-w="52">рік</button>
    </div>
  </div>
</div>

<div class="river" id="river">
  <svg id="svg" preserveAspectRatio="none" viewBox="0 0 1000 300"></svg>
  <div class="scrub" id="scrub"></div>
  <div class="marks" id="marks"></div>
  <div class="tip" id="tip"></div>
</div>

<div class="arms" id="arms"></div>

<div class="file" id="file"></div>

<div id="all">
  <div class="slab">
    <h4>Останнє, що чула апка</h4>
    <div class="mt" id="mt"></div>
  </div>
</div>

<script>
const P=[
 {id:'p1',n:'VF-AIA',             c:'oklch(76% 0.155 42)'},
 {id:'p2',n:'Архітектура сховища',c:'oklch(66% 0.19 12)'},
 {id:'p3',n:'Операційка',         c:'oklch(83% 0.14 82)'},
 {id:'p4',n:'Дослідження',        c:'oklch(70% 0.13 340)'},
 {id:'p0',n:'Поза проєктами',     c:'oklch(48% 0.05 235)'},
]
const T=['Статуси трьох агентів і блокери','Інтеграція нового апікачника',
 'Пайплайн у blob storage та парсинг','Рефайнмент рольової моделі','Ретро спринту',
 'Демо для замовника','Дзвінок із безпекою','Розбір багів і якість','Планування на тиждень']
const FOLK=['Olena','Dima','Serhii','Tanya','Bohdan','Maryna']
const TODAY=new Date('2026-09-07T00:00:00')
let seed=99117; const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x80000000

const MS=[]
for(let d=364;d>=0;d--){
  const date=new Date(TODAY); date.setDate(date.getDate()-d)
  const wk=date.getDay()===0||date.getDay()===6
  const era = d>250?[3,3,4]: d>150?[1,1,3,4]:
              d>60 ?[1,0,0,4]:[0,0,2,2,4]
  const n=wk?(rnd()<.14?1:0):1+Math.floor(rnd()*rnd()*4)
  for(let k=0;k<n;k++)MS.push({date,hour:9+rnd()*10,mins:5+rnd()*rnd()*85,
    p:P[era[Math.floor(rnd()*era.length)]],
    open:rnd()<.27?Math.ceil(rnd()*5):0,t:T[Math.floor(rnd()*T.length)],
    who:[...new Set(Array.from({length:1+Math.floor(rnd()*rnd()*5)},()=>FOLK[Math.floor(rnd()*FOLK.length)]))]})
}

let weeks=26, picked=null
const svg=document.getElementById('svg'), W=1000, H=300

/* тижневі суми по кожному рукаву */
function weekly(){
  const out=[]
  for(let i=weeks-1;i>=0;i--){
    const to=new Date(TODAY); to.setDate(to.getDate()-i*7)
    const from=new Date(to); from.setDate(from.getDate()-7)
    const bucket={date:to}
    P.forEach(p=>bucket[p.id]=MS.filter(m=>m.p.id===p.id&&m.date>from&&m.date<=to)
      .reduce((s,m)=>s+m.mins,0)/60)
    out.push(bucket)
  }
  return out
}

/* м'яка крива через точки — ріка не має кутів */
function curve(pts){
  if(pts.length<2) return ''
  let d=`M${pts[0][0]},${pts[0][1]}`
  for(let i=0;i<pts.length-1;i++){
    const [x0,y0]=pts[i], [x1,y1]=pts[i+1], mx=(x0+x1)/2
    d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`
  }
  return d
}

function draw(){
  const data=weekly()
  const totals=data.map(b=>P.reduce((s,p)=>s+b[p.id],0))
  const peak=Math.max(...totals,1)
  const step=W/(data.length-1)
  svg.innerHTML=''
  const ns='http://www.w3.org/2000/svg'
  const defs=document.createElementNS(ns,'defs'); svg.appendChild(defs)

  // стек знизу вгору, з центруванням — потік, а не башта
  const base=data.map((b,i)=>[i*step, H/2 + totals[i]/peak*(H*0.42)/2])
  let floor=base.slice()
  P.forEach((p,pi)=>{
    const top=data.map((b,i)=>[i*step, floor[i][1] - b[p.id]/peak*(H*0.42)])
    const path=document.createElementNS(ns,'path')
    const grad=document.createElementNS(ns,'linearGradient')
    grad.id='g'+pi; grad.setAttribute('x1','0');grad.setAttribute('y1','0')
    grad.setAttribute('x2','0');grad.setAttribute('y2','1')
    grad.innerHTML=`<stop offset="0" stop-color="${p.c}" stop-opacity=".95"/>
                    <stop offset="1" stop-color="${p.c}" stop-opacity=".55"/>`
    defs.appendChild(grad)
    path.setAttribute('d', curve(top)+' L'+curve(floor.slice().reverse()).slice(1)+' Z')
    path.setAttribute('fill','url(#g'+pi+')')
    path.dataset.p=p.id
    path.onclick=()=>open_(p.id)
    svg.appendChild(path)
    floor=top
  })
  marks(data)
  mute()
}

function marks(data){
  const el=document.getElementById('marks'); el.innerHTML=''
  const seen=new Set()
  data.forEach(b=>{
    const s=document.createElement('span')
    const k=b.date.getMonth()
    if(!seen.has(k)){seen.add(k); s.textContent=b.date.toLocaleDateString('uk',{month:'short'}).replace('.','')}
    el.appendChild(s)
  })
}

function mute(){
  svg.querySelectorAll('path').forEach(p=>p.classList.toggle('mute',picked&&p.dataset.p!==picked))
}

/* ── рукави ───────────────────────────────────────────────────────── */
const arms=document.getElementById('arms')
P.forEach(p=>{
  const mine=MS.filter(m=>m.p.id===p.id)
  const hrs=mine.reduce((s,m)=>s+m.mins,0)/60
  const bars=Array.from({length:20},(_,i)=>{
    const h=MS.filter(m=>m.p.id===p.id&&+m.date>+TODAY-(20-i)*18*864e5&&+m.date<=+TODAY-(19-i)*18*864e5)
      .reduce((s,m)=>s+m.mins,0)/60
    return `<i style="height:${Math.min(2+h*1.6,16)}px"></i>`
  }).join('')
  const a=document.createElement('div'); a.className='arm'; a.style.color=p.c; a.dataset.p=p.id
  a.innerHTML=`<div class="nm">${p.n}</div>
    <div class="fig">${hrs.toFixed(0)}<em>год · ${mine.length} нарад</em></div>
    <div class="tr">${bars}</div>`
  a.onclick=()=>open_(p.id)
  arms.appendChild(a)
})

function open_(id){
  picked = picked===id ? null : id
  document.querySelectorAll('.arm').forEach(a=>a.classList.toggle('on',a.dataset.p===picked))
  document.getElementById('river').classList.toggle('low',!!picked)
  document.getElementById('file').classList.toggle('on',!!picked)
  document.getElementById('all').style.display=picked?'none':''
  document.getElementById('where').textContent=picked?P.find(p=>p.id===picked).n:'часу'
  mute()
  if(picked) file(P.find(p=>p.id===picked))
}

/* ── досьє ────────────────────────────────────────────────────────── */
function file(p){
  const mine=MS.filter(m=>m.p.id===p.id)
  const hrs=mine.reduce((s,m)=>s+m.mins,0)/60
  const open=mine.reduce((s,m)=>s+m.open,0)
  const tally={}; mine.forEach(m=>m.who.forEach(w=>tally[w]=(tally[w]||0)+m.mins))
  const folk=Object.entries(tally).sort((a,b)=>b[1]-a[1])
  const top=folk[0]?.[1]||1
  const recent=new Set(mine.slice(-8).flatMap(m=>m.who))
  const days=Math.round((+TODAY-+mine[0].date)/864e5)

  document.getElementById('file').innerHTML=`
  <div class="title" style="color:${p.c}">
    <span class="mark"></span>
    <div style="flex:1;min-width:0">
      <input value="${p.n}" spellcheck="false">
      <div class="strip">
        <div><div class="k">живе</div><div class="v">${days} днів</div></div>
        <div><div class="k">нарад</div><div class="v">${mine.length}</div></div>
        <div><div class="k">годин</div><div class="v">${hrs.toFixed(1)}</div></div>
        <div><div class="k">людей</div><div class="v">${folk.length}</div></div>
        <div><div class="k">незакрито</div><div class="v" style="color:${open?'var(--c2)':'inherit'}">${open}</div></div>
        <div><div class="k">востаннє</div><div class="v">${mine[mine.length-1].date.toLocaleDateString('uk',{day:'numeric',month:'short'})}</div></div>
      </div>
    </div>
  </div>

  <div class="cols">
    <div class="slab">
      <h4>Де воно стоїть <span class="llm">зібрано моделлю з ${mine.length} нарад</span></h4>
      <div class="said">
        Міграцію узгоджено, чекає на ревʼю безпеки. Доступ лишається через VPN —
        <b>рішення від 5 вересня</b> скасувало попереднє, відкрите назовні.
        Дві речі прострочені, обидві на боці безпеки. За останній місяць проєкт
        забрав <b>${(hrs/6).toFixed(1)} год на тиждень</b>.
      </div>

      <h4 style="margin-top:20px">Робота</h4>
      <div class="rows" style="color:${p.c}">
        <div class="r"><span class="x">Узгодити перелік ролей із безпекою</span><span class="m">казано ×3</span></div>
        <div class="r"><span class="x">Підготувати матеріали для замовника</span><span class="m hot">Olena · прострочено 4 дні</span></div>
        <div class="r"><span class="x">Віддати IP-діапазони</span><span class="m">Serhii</span></div>
        <div class="r off"><span class="x">Закрити доступ ззовні</span><span class="m">29 сер</span></div>
      </div>

      <h4 style="margin-top:20px">Вирішено, і що це скасувало</h4>
      <div class="rows" style="color:${p.c}">
        <div class="r"><span class="x">Доступ лишається через VPN</span><span class="m">5 вер</span></div>
        <div class="r off"><span class="x">Відкрити назовні</span><span class="m">скасовано 5 вер</span></div>
      </div>

      <h4 style="margin-top:20px">Досі без відповіді</h4>
      <div class="rows" style="color:${p.c}">
        <div class="r"><span class="x">Які IP-діапазони віддаємо назовні</span><span class="m">питано ×3, з 22 сер</span></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="slab" style="color:${p.c}">
        <h4>Хто тут був <span style="text-transform:none;letter-spacing:0;color:var(--faint)">${folk.length} за весь час</span></h4>
        <div class="crowd">
          ${folk.slice(0,6).map(([w,m])=>`
            <div class="head-p${recent.has(w)?'':' gone'}">
              <span class="col" style="height:${Math.max(m/top*74,7)}px"></span>
              <span class="nm">${w}</span>
              <span class="hh">${(m/60).toFixed(1)} год</span>
            </div>`).join('')}
        </div>
        <div style="font-size:10.5px;color:var(--faint);line-height:1.5">
          Пригаслі — ті, кого не було на останніх восьми нарадах.
        </div>
      </div>

      <div class="slab" style="color:${p.c}">
        <h4>Керування</h4>
        <div class="set">
          <div class="opt"><div class="l">Колір рукава</div>
            <span class="dots">
              ${P.filter(x=>x.id!=='p0').map(x=>`<i style="background:${x.c}" class="${x.c===p.c?'on':''}"></i>`).join('')}
              <i style="background:oklch(74% 0.15 190)"></i><i style="background:oklch(80% 0.14 130)"></i>
            </span></div>
          <div class="opt"><div><div class="l">Саммарі кожної наради</div>
            <div class="h">Інакше — лише коли натиснете самі</div></div><span class="sw on"></span></div>
          <div class="opt"><div><div class="l">Тримати аудіо</div>
            <div class="h">Через 90 днів лишається тільки текст</div></div><span class="sw"></span></div>
          <div class="opt"><div><div class="l">Стежити за дублікатами</div>
            <div class="h">Те саме, сказане двічі, не стає двома задачами</div></div><span class="sw on"></span></div>
          <div class="opt"><div><div class="l">Показувати в «Сьогодні»</div>
            <div class="h">Прострочене з цього проєкту підіймається нагору</div></div><span class="sw on"></span></div>
          <button class="kill">Розформувати — наради лишаться без проєкту</button>
        </div>
      </div>
    </div>
  </div>

  <div class="slab">
    <h4>Наради проєкту <span style="text-transform:none;letter-spacing:0;color:var(--faint)">${mine.length}</span></h4>
    <div class="mt">${mine.slice(-10).reverse().map(m=>`
      <div class="row">
        <span class="d">${m.date.toLocaleDateString('uk',{day:'numeric',month:'short'})} ·
          ${String(Math.floor(m.hour)).padStart(2,'0')}:${String(Math.floor(m.hour%1*60)).padStart(2,'0')}</span>
        <span class="t">${m.t}</span>
        <span class="e">${m.open?`<span class="bad" style="background:${p.c}">${m.open} відкрито</span>`:''}
          <span>${Math.round(m.mins)} хв</span><span>${m.who.join(' · ')}</span></span>
      </div>`).join('')}</div>
  </div>`

  document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>s.classList.toggle('on'))
  document.querySelectorAll('.r').forEach(r=>r.onclick=()=>r.classList.toggle('off'))
  document.querySelectorAll('.dots i').forEach(i=>i.onclick=e=>{
    document.querySelectorAll('.dots i').forEach(x=>x.classList.remove('on'))
    e.target.classList.add('on')
    const col=e.target.style.background
    document.querySelector('.title').style.color=col
    document.querySelectorAll('.slab[style], .rows[style]').forEach(b=>b.style.color=col)
  })
}

/* ── скраб по річці ───────────────────────────────────────────────── */
const river=document.getElementById('river'), tip=document.getElementById('tip'),
      scrub=document.getElementById('scrub')
river.onpointermove=e=>{
  const box=river.getBoundingClientRect()
  const x=e.clientX-box.left
  const data=weekly(), i=Math.max(0,Math.min(data.length-1,Math.round(x/box.width*(data.length-1))))
  const b=data[i]
  scrub.classList.add('on'); scrub.style.left=x+'px'
  tip.classList.add('on')
  tip.style.left=Math.max(6,Math.min(x+14,box.width-208))+'px'
  tip.style.top=Math.min(e.clientY-box.top+12,box.height-140)+'px'
  tip.innerHTML=`<div class="w">тиждень ${b.date.toLocaleDateString('uk',{day:'numeric',month:'long'})}</div>`+
    P.filter(p=>b[p.id]>0.05).sort((x,y)=>b[y.id]-b[x.id]).map(p=>
      `<div class="r"><i style="background:${p.c}"></i>${p.n}<b>${b[p.id].toFixed(1)} год</b></div>`).join('')
}
river.onpointerleave=()=>{scrub.classList.remove('on');tip.classList.remove('on')}

document.getElementById('pills').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return
  document.querySelectorAll('.pills button').forEach(x=>x.classList.remove('on'))
  b.classList.add('on'); weeks=+b.dataset.w; draw()
}

document.getElementById('mt').innerHTML=MS.slice(-12).reverse().map(m=>`
  <div class="row">
    <span class="d">${m.date.toLocaleDateString('uk',{day:'numeric',month:'short'})} ·
      ${String(Math.floor(m.hour)).padStart(2,'0')}:${String(Math.floor(m.hour%1*60)).padStart(2,'0')}</span>
    <span class="t">${m.t}</span>
    <span class="e">${m.open?`<span class="bad" style="background:${m.p.c}">${m.open} відкрито</span>`:''}
      <span>${Math.round(m.mins)} хв</span><span>${m.who.length} у кімнаті</span></span>
  </div>`).join('')

draw()
</script>
</body>
</html>
